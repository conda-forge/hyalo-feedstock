context:
  version: "0.24.0"

package:
  name: hyalo
  version: ${{ version }}

source:
  url: https://github.com/ractive/hyalo/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9741bd35196e580364251d81c226d8e0b10a11091e99474973943d42aca9c8f4

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/hyalo-cli
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/hyalo
          - ^$bin completion bash | save ($prefix)/share/bash-completion/completions/hyalo
          - ^$bin completion fish | save ($prefix)/share/fish/vendor_completions.d/hyalo.fish
          - ^$bin completion zsh  | save ($prefix)/share/zsh/site-functions/_hyalo

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - nushell

tests:
  - script:
      - hyalo --help
      - hyalo --version
  - package_contents:
      bin:
        - hyalo
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/hyalo
            - share/fish/vendor_completions.d/hyalo.fish
            - share/zsh/site-functions/_hyalo
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/hyalo
            - Library/share/fish/vendor_completions.d/hyalo.fish
            - Library/share/zsh/site-functions/_hyalo
      strict: true

about:
  summary: Download and install release assets from GitHub
  description: |
    Hyalo is a high-performance CLI tool designed to query, manage, and bulk-edit Markdown collections
    that use YAML frontmatter, such as Obsidian vaults, Zettelkastens, and static documentation sites.
    Hyalo natively understands Markdown structures to offer advanced filtering, bulk metadata mutations,
    and smart link refactoring across thousands of files in milliseconds. With native JSON output,
    built-in AI agent integrations, and robust dry-run safety features, Hyalo provides a fast,
    scriptable solution for maintaining and automating complex knowledge bases.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/ractive/hyalo
  repository: https://github.com/ractive/hyalo

extra:
  recipe-maintainers:
    - salim-b
